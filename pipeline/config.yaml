# Cyber Threat Exposure Map Configuration
project:
  id: cyber-exposure-map
  name: "Cyber Threat Exposure Map"
  description: "Real-time CVE exploits and exposed infrastructure."

openrouter:
  model: "nvidia/nemotron-3-super-120b-a12b:free"
  fallback_model: "z-ai/glm-5.2:free"

news_query: '(cybersecurity OR cyberattack OR vulnerability OR ransomware OR CVE) when:7d'

sources:
  - name: "CISA Known Exploited Vulnerabilities"
  - name: "FIRST EPSS"
  - name: "Google News RSS"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
