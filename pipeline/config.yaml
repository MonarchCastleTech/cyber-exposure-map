# Cyber Threat Exposure Map Configuration
project:
  id: cyber-exposure-map
  name: "Cyber Threat Exposure Map"
  description: "Real-time CVE exploits and exposed infrastructure."

openrouter:
  model: "z-ai/glm-5.2:free"
  fallback_model: "google/gemma-4-31b-it:free"

gdelt_query: "(cyberattack OR ransomware OR vulnerability OR CVE)"
include_forex: true

sources:
  - name: "GDELT"

refresh:
  interval_hours: 6
  retry_attempts: 3

scoring:
  scale: "1-10"
  thresholds:
    high: 7
    medium: 4
    low: 0
